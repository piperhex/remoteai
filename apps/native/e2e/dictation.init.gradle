// Exercise real phone recording without replacing the user's installed application.
gradle.afterProject { project ->
    if (project.path == ':app') {
        project.layout.buildDirectory.set(new File(project.projectDir, 'build-dictation'))
        project.android.defaultConfig.applicationId = 'com.codexswitch.mobile.dictationtest'
        project.extensions.getByName('react').entryFile = new File(project.rootDir, '../e2e/DictationFixture.tsx')
        project.extensions.getByName('react').debuggableVariants = []
    }
}
