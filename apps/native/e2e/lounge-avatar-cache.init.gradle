gradle.afterProject { project ->
    if (project.path == ':app') {
        project.android.defaultConfig.applicationId = 'com.codexswitch.mobile.avatarcachetest'
        project.extensions.getByName('react').entryFile = new File(project.rootDir, '../e2e/LoungeAvatarCacheFixture.tsx')
        project.android.applicationVariants.all { variant ->
            variant.outputs.all { outputFileName = 'lounge-avatar-cache-fixture.apk' }
        }
    }
}
