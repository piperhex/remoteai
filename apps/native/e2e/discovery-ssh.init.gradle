// Isolate SSH discovery verification from the user's installed app and data.
gradle.afterProject { project ->
    if (project.path == ':app') {
        project.layout.buildDirectory.set(new File(project.projectDir, 'build-discovery-ssh'))
        project.android.defaultConfig.applicationId = 'com.codexswitch.mobile.discoverysshtest'
        project.extensions.getByName('react').entryFile =
            new File(project.rootDir, '../e2e/DiscoverySshFixture.tsx')
        project.extensions.getByName('react').debuggableVariants = []
    }
}
