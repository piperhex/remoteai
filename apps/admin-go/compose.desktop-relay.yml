# Add this file to the existing Go Compose stack. Never publish coturn's 3478 listener.
services:
  admin-go:
    environment:
      DESKTOP_TURN_LISTEN: "0.0.0.0:3479"
      DESKTOP_TURN_BACKEND: "desktop-turn:3478"
      DESKTOP_TURN_CONTROL: "desktop-turn:5766"
      DESKTOP_TURN_CONTROL_PASSWORD: "${DESKTOP_TURN_CONTROL_PASSWORD:?Generate a separate TURN control password}"
      DESKTOP_TURN_QUOTA_DIR: /var/lib/codex-switch/turn-quota
    volumes:
      - turn-quota:/var/lib/codex-switch/turn-quota
    ports:
      - "${ADMIN_GO_TURN_BIND:-0.0.0.0}:3479:3479/udp"
      - "${ADMIN_GO_TURN_BIND:-0.0.0.0}:3479:3479/tcp"
      - "${ADMIN_GO_TURN_BIND:-0.0.0.0}:5349:5349/tcp"
    networks:
      media-relay:
    depends_on:
      desktop-turn:
        condition: service_started
  desktop-turn:
    image: coturn/coturn:4.18.0-r0@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/codex/turn-entrypoint.sh"]
    environment:
      DESKTOP_TURN_SECRET: "${DESKTOP_TURN_SECRET:?Generate a separate TURN secret}"
      DESKTOP_TURN_PUBLIC_IP: "${DESKTOP_TURN_PUBLIC_IP:?Set the public relay IPv4 address}"
      DESKTOP_TURN_REALM: "${DESKTOP_TURN_REALM:-codex-switch}"
      DESKTOP_TURN_CONTROL_PASSWORD: "${DESKTOP_TURN_CONTROL_PASSWORD:?Generate a separate TURN control password}"
    volumes:
      - ./scripts/turn-entrypoint.sh:/opt/codex/turn-entrypoint.sh:ro
      - turn-quota:/var/lib/codex-switch/turn-quota:ro
    ports:
      - "${ADMIN_GO_TURN_BIND:-0.0.0.0}:50000-50199:50000-50199/udp"
    networks:
      media-relay:
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    # The upstream turnserver executable carries this file capability and cannot exec without it.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
networks:
  media-relay:
volumes:
  turn-quota:
