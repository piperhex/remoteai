name: codex-admin-parity
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: parity
      POSTGRES_PASSWORD: local-parity-only
      POSTGRES_DB: legacy
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["parity-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parity -d legacy"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.29
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports: ["127.0.0.1:18025:8025"]
  oauth:
    image: node:22-alpine
    command: ["node", "/mock/mock-oauth.mjs"]
    environment:
      ENABLE_TLS_PROXY: "1"
    volumes: ["./testdata:/mock:ro"]
    ports: ["127.0.0.1:18026:8080"]
    networks:
      default:
        aliases: ["auth.openai.com", "chatgpt.com", "api.currencyapi.com"]
  redis-go:
    image: redis:7-alpine
    ports: ["127.0.0.1:16380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  legacy:
    build:
      context: ../..
      dockerfile: apps/admin-go/testdata/Dockerfile.legacy
    environment: &test-environment
      NODE_ENV: development
      LISTEN_PORT: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: parity
      POSTGRES_PASSWORD: local-parity-only
      POSTGRES_DB: legacy
      POSTGRES_DB_SYNCHRONIZE: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KONG_JWT_KEY: codex-switch-parity
      KONG_JWT_SECRET: local-parity-access-secret-not-for-production
      JWT_REFRESH_SECRET: local-parity-refresh-secret-not-for-production
      CHAT_STUN_PORT: "3478"
      CODEX_OAUTH_ISSUER: http://oauth:8080
      CODEX_OUTBOUND_PROXY: http://oauth:8081
      NODE_EXTRA_CA_CERTS: /fixtures/tls/ca.crt
      SSL_CERT_FILE: /fixtures/tls/ca.crt
      mail__transport: SMTP
      mail__options__host: mailpit
      mail__options__port: "1025"
      mail__options__secure: "false"
      mail__options__auth__user: parity
      mail__options__auth__pass: local-parity-only
      mail__from: "Remote AI <noreply@example.test>"
    ports: ["127.0.0.1:28080:8080", "127.0.0.1:13479:3478/udp"]
    volumes: ["./testdata:/fixtures:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      mailpit: {condition: service_started}
  admin-go:
    profiles: ["go"]
    build:
      context: ../..
      dockerfile: apps/admin-go/Dockerfile
    environment:
      <<: *test-environment
      POSTGRES_DB: admin_go
      POSTGRES_DB_SYNCHRONIZE: "false"
      REDIS_HOST: redis-go
      CHAT_BULK_LEASES_ENABLED: "${CHAT_BULK_LEASES_ENABLED:-false}"
    ports: ["127.0.0.1:28081:8080", "127.0.0.1:13478:3478/udp"]
    volumes: ["./public:/app/public:ro", "./testdata:/fixtures:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      redis-go: {condition: service_healthy}
      mailpit: {condition: service_started}
volumes:
  parity-postgres:
