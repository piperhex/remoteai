_format_version: "3.0"
_transform: true

# Import this into your existing Kong only if you use declarative config.
# For DB-backed Kong, follow the Admin API guidance in ../DEPLOYMENT.md instead.

services:
  - name: codex-switch-web
    url: http://codex-switch-web:80
    routes:
      - name: codex-switch-web
        paths:
          - /web
        strip_path: true

  - name: codex-switch-admin-go
    url: http://codex-switch-admin-go:8080
    routes:
      - name: codex-switch-public
        paths:
          - /auth
          - /admin
          - /feedback
          - /announcements
          - /notifications
          - /faqs
          - /currency-rates
          - /token-cost-presets
          - /telemetry
          - /device-switch
          - /device-chat
          # Opaque device credential; authenticated by Go, not the account JWT plugin.
          - /desktop-service/revoke
          - /prompt-plugins
          - /skills
          - /codex-home-presets
          - /chat/title-settings
        strip_path: false
      - name: codex-switch-protected
        paths:
          - /sync
          - /official-usage
          - /admin/api
          - /devices
          - /remote-assistance
          - /chat-push
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              run_on_preflight: false
              claims_to_verify:
                - exp

consumers:
  - username: codex-switch-client
    jwt_secrets:
      - key: codex-switch
        # Replace this before importing; it must match backend KONG_JWT_SECRET.
        secret: REPLACE_WITH_A_RANDOM_SECRET
        algorithm: HS256
