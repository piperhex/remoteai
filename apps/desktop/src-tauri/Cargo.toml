[package]
name = "csw"
version = "1.0.21"
description = "Local multi-account manager for Codex auth.json"
authors = ["Remote AI"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "codex_switch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
test = false

[[bin]]
name = "csw"
path = "src/main.rs"
test = false

[[test]]
name = "codex_switch_lib_tests"
path = "src/test_main.rs"

[build-dependencies]
sha2 = "0.10"
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
csw-chat-connectivity = { path = "../../../crates/chat-connectivity" }
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
base64 = "0.22"
bytes = "1"
aes-gcm = "0.10"
chrono = { version = "0.4", features = ["serde"] }
crypto_box = { version = "0.9.1", features = ["seal"] }
dirs = "6"
ed25519-dalek = { version = "2.2", features = ["pkcs8"] }
flate2 = "1"
futures-util = "0.3"
html5ever = "0.38"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
json5 = "0.4"
md-5 = "0.10"
mime_guess = "2"
keyring = "4.1.5"
portable-pty = "0.9"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking", "cookies", "json", "multipart", "rustls-tls", "socks", "stream",
] }
rqrr = "0.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
semver = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "unstable"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2.10.1"
tiny_http = "0.12"
thiserror = "2"
tar = "0.4"
tokio = { version = "1", features = ["macros", "sync", "time", "process", "io-util", "net"] }
toml_edit = "0.25"
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = "0.13"
rusqlite = { version = "0.32.1", default-features = false, features = ["bundled"] }
sysinfo = "0.37"

[dev-dependencies]
qrcode = "0.14.1"
tauri = { version = "2", features = ["test"] }

# hyper-util 0.1.20 writes two USERID terminators and breaks SOCKS4/4a tunnels.
# See vendor/hyper-util/CODEX_SWITCH_PATCH.md for the narrow patch and removal criteria.
[patch.crates-io]
hyper-util = { path = "vendor/hyper-util" }

[patch."https://github.com/EasyTier/EasyTier"]
easytier-core = { path = "../../../crates/chat-connectivity/vendor/easytier-core" }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Networking_WinHttp",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_System_StationsAndDesktops",
  "Win32_System_RemoteDesktop",
  "Win32_System_Shutdown",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_System_DataExchange",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"
windows = { version = "0.61", features = [
  "Data_Xml_Dom",
  "UI_Notifications",
  "ApplicationModel",
  "ApplicationModel_Core",
  "Foundation",
  "Management_Deployment",
  "Storage",
  "Storage_Search",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
] }
webrtc = "0.17.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
