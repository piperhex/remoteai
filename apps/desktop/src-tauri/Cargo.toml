[package]
name = "csw"
version = "2.0.20"
description = "Local multi-account manager for Codex auth.json"
authors = ["Remote AI"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "codex_switch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
test = false

[[bin]]
name = "csw"
path = "src/main.rs"
test = false

[[test]]
name = "codex_switch_lib_tests"
path = "src/test_main.rs"

[[test]]
name = "windows_input_reentrancy"
path = "tests/windows_input_reentrancy.rs"

[build-dependencies]
sha2 = "0.10"
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
csw-ssh-client = { path = "../../../crates/ssh-client" }
csw-chat-connectivity = { path = "../../../crates/chat-connectivity" }
csw-provider-balance-script = { path = "../../../crates/provider-balance-script" }
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
base64 = "0.22"
bytes = "1"
aes-gcm = "0.10"
chrono = { version = "0.4", features = ["serde"] }
crypto_box = { version = "0.9.1", features = ["seal"] }
chacha20poly1305 = "0.10"
zeroize = "1"
dirs = "6"
ed25519-dalek = { version = "2.2", features = ["pkcs8"] }
flate2 = "1"
futures-util = "0.3"
html5ever = "0.38"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
json5 = "0.4"
md-5 = "0.10"
percent-encoding = "2.3"
mime_guess = "2"
minisign-verify = "0.2"
keyring = "4.1.5"
portable-pty = "0.9"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking", "cookies", "gzip", "json", "multipart", "rustls-tls", "socks", "stream",
] }
rqrr = "0.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
semver = "1"
sha2 = "0.10"
# Keep the inspector available on demand in release builds without opening it at startup.
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "unstable", "devtools"] }
tempfile = "3"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2"
# Stay compatible with the current Tauri runtime and its Windows input patch.
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2.10.1"
tiny_http = "0.12"
thiserror = "2"
tar = "0.4"
tokio = { version = "1", features = ["macros", "sync", "time", "process", "io-util", "io-std", "net"] }
toml_edit = "0.25"
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = "0.13"
xcap = "=0.9.8"
rusqlite = { version = "0.32.1", default-features = false, features = ["bundled", "functions"] }
sysinfo = "0.37"

[dev-dependencies]
qrcode = "0.14.1"
tauri = { version = "2", features = ["test"] }

[dev-dependencies.easytier]
git = "https://github.com/EasyTier/EasyTier"
rev = "ed73d318bb3bf19601e227ab83dd61d66ce4b9f8"
default-features = false

# hyper-util 0.1.20 writes two USERID terminators and breaks SOCKS4/4a tunnels.
# See vendor/hyper-util/CODEX_SWITCH_PATCH.md for the narrow patch and removal criteria.
[patch.crates-io]
hyper-util = { path = "vendor/hyper-util" }
# Backport Tao's Windows/RDP input deadlock fix without changing Tauri's Tao API.
# See vendor/tao/CODEX_SWITCH_PATCH.md for provenance and regression coverage.
tao = { path = "vendor/tao" }

[target.'cfg(windows)'.dev-dependencies]
tao = { version = "0.35.3", default-features = false, features = ["rwh_06"] }

[patch."https://github.com/EasyTier/EasyTier"]
easytier-core = { path = "../../../crates/chat-connectivity/vendor/easytier-core" }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows-core = "0.61"
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Networking_WinHttp",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Authentication_Identity",
  "Win32_Security_Cryptography",
  "Win32_System_StationsAndDesktops",
  "Win32_System_RemoteDesktop",
  "Win32_System_Shutdown",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Console",
  "Win32_System_Environment",
  "Win32_System_JobObjects",
  "Win32_System_DataExchange",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"
windows = { version = "0.61", features = [
  "Win32_Media_Audio_Endpoints",
  "Win32_Graphics_Gdi",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Power",
  "Win32_UI_WindowsAndMessaging",
  "Data_Xml_Dom",
  "UI_Notifications",
  "ApplicationModel",
  "ApplicationModel_Core",
  "Foundation",
  "Management_Deployment",
  "Networking_Connectivity",
  "Storage",
  "Storage_Search",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
  "Win32_UI_Accessibility",
] }
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
webrtc = "0.17.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
