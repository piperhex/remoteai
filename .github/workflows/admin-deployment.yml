name: Admin and Web deployment configuration

on:
  push:
    paths:
      - 'apps/admin'
      - 'apps/admin-ui'
      - 'scripts/admin-integration.test.mjs'
      - 'apps/web'
      - 'scripts/deploy.mjs'
      - 'scripts/lib/web-deployment.mjs'
      - 'scripts/web-deployment.test.mjs'
      - 'package.json'
      - '.github/workflows/admin-deployment.yml'
  pull_request:
    paths:
      - 'apps/admin'
      - 'apps/admin-ui'
      - 'scripts/admin-integration.test.mjs'
      - 'apps/web'
      - 'scripts/deploy.mjs'
      - 'scripts/lib/web-deployment.mjs'
      - 'scripts/web-deployment.test.mjs'
      - 'package.json'
      - '.github/workflows/admin-deployment.yml'

permissions:
  contents: read

jobs:
  web-compose-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned Web configuration
        run: git submodule update --init apps/web
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify Web deployment configuration and health checks
        env:
          COMPOSE_CONFIG_TEST: '1'
        run: node --test scripts/web-deployment.test.mjs

  admin-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned admin repositories
        run: git submodule update --init apps/admin apps/admin-ui
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify client and backend contract defaults
        run: node --test scripts/admin-integration.test.mjs
      - name: Build the pinned backend and UI together
        run: docker build --build-context admin-ui=apps/admin-ui -f apps/admin/Dockerfile -t remoteai-admin:check apps/admin
