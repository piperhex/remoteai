name: Internationalization

on:
  push:
    branches: [master]
    paths:
      - 'packages/i18n'
      - 'shared/**'
      - 'apps/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/i18n.yml'
      - 'shared'
  pull_request:
    paths:
      - 'packages/i18n'
      - 'shared/**'
      - 'apps/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/i18n.yml'
      - 'shared'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize language package
        shell: bash
        run: |
          if git config -f .gitmodules --get submodule.packages/i18n.path > /dev/null; then
            git submodule update --init packages/i18n
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Initialize shared sources
        run: git submodule update --init shared
      - run: npm ci --workspace @remoteai/i18n --include-workspace-root=false --ignore-scripts
      - run: npm run check:i18n
