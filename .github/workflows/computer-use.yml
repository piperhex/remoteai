name: Computer Use macOS

on:
  push:
    paths:
      - "apps/desktop/src-tauri/src/**"
      - "apps/desktop/src-tauri/Cargo.*"
      - "apps/desktop/src-tauri/Info.plist"
      - "apps/desktop/src-tauri/desktop-video-macos/**"
      - "scripts/build-desktop-video-macos.mjs"
      - "apps/desktop/src-tauri/desktop-privacy/**"
      - "scripts/*desktop-privacy.mjs"
      - "apps/desktop/src-tauri/resources/codex-switch-computer-use/**"
      - ".github/workflows/computer-use.yml"
  pull_request:
    paths:
      - "apps/desktop/src-tauri/src/**"
      - "apps/desktop/src-tauri/Cargo.*"
      - "apps/desktop/src-tauri/Info.plist"
      - "apps/desktop/src-tauri/desktop-video-macos/**"
      - "scripts/build-desktop-video-macos.mjs"
      - "apps/desktop/src-tauri/desktop-privacy/**"
      - "scripts/*desktop-privacy.mjs"
      - "apps/desktop/src-tauri/resources/codex-switch-computer-use/**"
      - ".github/workflows/computer-use.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    # Cold Intel compilation took 40 minutes before tests; leave room for checks and cache publication.
    timeout-minutes: ${{ matrix.runner == 'macos-15-intel' && 60 || 45 }}
    env:
      # Keep debug assertions, but avoid archiving full debug symbols for CI dependencies.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
      - name: Initialize language package
        shell: bash
        run: |
          if git config -f .gitmodules --get submodule.packages/i18n.path > /dev/null; then
            git submodule update --init packages/i18n
          fi
      - uses: actions/setup-node@v6
        with:
          # Match release builds instead of changing the runtime with each new LTS.
          node-version: '22'
          cache: npm
      - name: Initialize shared sources
        run: git submodule update --init shared
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install isolated Rust test runner
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: swatinem/rust-cache@v2
        with:
          key: computer-use-${{ matrix.runner }}
          cache-bin: false
          workspaces: "./apps/desktop/src-tauri -> target"
      - run: npm ci
      - run: brew install protobuf
      - name: Build and test the universal macOS desktop video helper
        run: node scripts/build-desktop-video-macos.mjs
      - name: Build the universal privacy helper and test recovery protocol without changing displays
        run: node scripts/prepare-desktop-privacy.mjs
      - name: Build desktop frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build:desktop
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      # Re-entering Cargo for each filter rebuilt the Tauri test binary on Intel and exhausted the job deadline.
      # Reuse one build for both suites and the pinned archive check; isolate process-wide native state per test.
      - name: Build desktop tests once
        run: >-
          cargo nextest archive --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          --test codex_switch_lib_tests --archive-file "${{ runner.temp }}/desktop-tests.tar.zst"
      - name: Verify Computer Use and remote desktop
        timeout-minutes: 10
        run: >-
          cargo nextest run --archive-file "${{ runner.temp }}/desktop-tests.tar.zst"
          --test-threads 1 --no-fail-fast --no-tests fail
          -E 'test(computer_use) | test(remote_desktop)'
      - name: Verify the pinned macOS release archive
        timeout-minutes: 5
        env:
          CSW_CUA_TEST_ARCHIVE: ${{ runner.temp }}/cua-driver.tar.gz
          CUA_VERSION: 0.37.0-remoteai.2
        run: |
          release="https://github.com/piperhex/remoteai/releases/download/cua-v$CUA_VERSION"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 60 --output "$CSW_CUA_TEST_ARCHIVE" \
            "$release/cua-driver-rs-$CUA_VERSION-darwin-universal-binary.tar.gz"
          cargo nextest run --archive-file "${{ runner.temp }}/desktop-tests.tar.zst" \
            --run-ignored only --no-tests fail -E 'test(verifies_and_extracts_pinned_macos_release)'
