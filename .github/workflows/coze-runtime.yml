name: Coze Rust Runtime

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source ref
        type: string
        required: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
  pull_request:
    paths:
      - "apps/coze/**"
      - "shared/coze/**"
      - "shared/i18n/language.ts"
      - "shared/i18n/testLocale.ts"
      - "package-lock.json"
      - "scripts/*coze*"
      - ".github/workflows/coze-runtime.yml"

permissions:
  contents: write

concurrency:
  group: coze-runtime
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Check and build Coze UI
        run: |
          node node_modules/typescript/bin/tsc -p apps/coze/ui/tsconfig.json
          node node_modules/vitest/vitest.mjs run --config apps/coze/ui/vite.config.ts
          node node_modules/vite/bin/vite.js build --config apps/coze/ui/vite.config.ts
      - name: Check workflow canvas interactions
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -w @codex-switch/coze
      - uses: actions/cache@v4
        with:
          path: apps/coze/dist/models
          key: coze-model-${{ hashFiles('apps/coze/runtime.json', 'scripts/prepare-coze-model.mjs') }}
      - run: node scripts/prepare-coze-model.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: coze-assets
          path: apps/coze/dist
          compression-level: 0

  runtime:
    needs: assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            extension: .exe
            msvcArch: amd64
          - name: windows-aarch64
            os: windows-2022
            target: aarch64-pc-windows-msvc
            extension: .exe
            msvcArch: amd64_arm64
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            extension: ""
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            extension: ""
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            extension: ""
    runs-on: ${{ matrix.os }}
    env:
      # The optional Windows package must run without installing a separate VC++ runtime.
      RUSTFLAGS: ${{ startsWith(matrix.name, 'windows') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Configure Windows compiler
        if: startsWith(matrix.name, 'windows')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvcArch }}
      - name: Configure Windows ARM64 bindings
        if: matrix.name == 'windows-aarch64'
        shell: pwsh
        run: |
          $llvm = Join-Path $env:ProgramFiles 'LLVM/bin'
          if (-not (Test-Path (Join-Path $llvm 'libclang.dll'))) {
            throw 'LLVM libclang is required to generate Windows ARM64 JavaScript bindings.'
          }
          "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV
          $llvm >> $env:GITHUB_PATH
      - uses: swatinem/rust-cache@v2
        with:
          key: coze-${{ matrix.name }}
          workspaces: apps/coze
      - uses: actions/download-artifact@v4
        with:
          name: coze-assets
          path: apps/coze/dist
      - name: Verify Rust services
        run: |
          cargo fmt --manifest-path apps/coze/Cargo.toml -- --check
          cargo test --locked --manifest-path apps/coze/Cargo.toml
          cargo test --locked --manifest-path apps/coze/Cargo.toml --test local_embedding -- --ignored
          cargo clippy --locked --manifest-path apps/coze/Cargo.toml --all-targets -- -D warnings
      - name: Build standalone runtime
        run: cargo build --bins --release --locked --manifest-path apps/coze/Cargo.toml --target ${{ matrix.target }}
      - run: npm ci
      - name: Verify Windows runtime independence
        if: startsWith(matrix.name, 'windows')
        run: |
          node scripts/verify-windows-runtime.mjs apps/coze/target/${{ matrix.target }}/release/remoteai-coze.exe
          node scripts/verify-windows-runtime.mjs apps/coze/target/${{ matrix.target }}/release/remoteai-coze-python.exe
      - name: Stage independent package
        run: >-
          node scripts/package-coze.mjs
          apps/coze/target/${{ matrix.target }}/release/remoteai-coze${{ matrix.extension }}
          apps/coze/dist/package
      - name: Exercise packaged runtime and MCP
        if: matrix.name != 'windows-aarch64' && matrix.name != 'macos-x86_64'
        run: node scripts/smoke-coze.mjs apps/coze/dist/package/remoteai-coze${{ matrix.extension }}
      - name: Archive package
        shell: bash
        run: |
          python -c "import shutil; shutil.make_archive('apps/coze/dist/coze-${{ matrix.name }}','zip','apps/coze/dist/package')"
      - name: Sign package
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npx tauri signer sign --password "" "apps/coze/dist/coze-${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: coze-${{ matrix.name }}
          path: |
            apps/coze/dist/coze-${{ matrix.name }}.zip
            apps/coze/dist/coze-${{ matrix.name }}.zip.sig
          compression-level: 0

  publish:
    if: github.event_name != 'pull_request'
    needs: runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: coze-*
          merge-multiple: true
          path: release-coze
      - name: Publish independent, immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(node -p "require('./apps/coze/runtime.json').releaseTag")"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = "false" ]; then
              gh release view "$tag" --json assets --jq '.assets[].name' > /tmp/coze-assets.txt
              for platform in windows-x86_64 windows-aarch64 macos-x86_64 macos-aarch64 linux-x86_64; do
                grep -Fx "coze-$platform.zip" /tmp/coze-assets.txt
                grep -Fx "coze-$platform.zip.sig" /tmp/coze-assets.txt
              done
              echo "Coze release $tag is complete; published packages are immutable."
              exit 0
            fi
          else
            gh release create "$tag" --draft --target "$(git rev-parse HEAD)" \
              --title "Coze Rust Runtime $tag" --latest=false \
              --notes "Independent optional Coze package for Remote AI. Downloads on first use; includes local knowledge models."
          fi
          gh release upload "$tag" release-coze/coze-*.zip release-coze/coze-*.zip.sig --clobber
          gh release edit "$tag" --draft=false --latest=false
