name: Shared consumer integration

on:
  push:
    paths:
      - 'shared'
      - 'packages/i18n'
      - '.gitmodules'
      - 'scripts/export-admin-ui-dependencies.mjs'
      - 'scripts/export-native-dependencies.mjs'
      - 'scripts/*release*.mjs'
      - 'scripts/i18n*.mjs'
      - 'package*.json'
      - '.github/workflows/release.yml'
      - '.husky/pre-commit'
      - 'scripts/git-hook-environment.test.mjs'
      - '.github/workflows/shared-integration.yml'
  pull_request:
    paths:
      - 'shared'
      - 'packages/i18n'
      - '.gitmodules'
      - 'scripts/export-admin-ui-dependencies.mjs'
      - 'scripts/export-native-dependencies.mjs'
      - 'scripts/*release*.mjs'
      - 'scripts/i18n*.mjs'
      - 'package*.json'
      - '.github/workflows/release.yml'
      - '.husky/pre-commit'
      - 'scripts/git-hook-environment.test.mjs'
      - '.github/workflows/shared-integration.yml'

permissions:
  contents: read

jobs:
  consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize required source repositories
        run: |
          git submodule update --init shared apps/web
          if git config -f .gitmodules --get submodule.packages/i18n.path > /dev/null; then
            git submodule update --init packages/i18n
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify hooks and independent releases
        run: >-
          node --test scripts/git-hook-environment.test.mjs scripts/native-release-isolation.test.mjs
          scripts/release-workflow.test.mjs scripts/organize-release-downloads.test.mjs
          scripts/sync-native-release.test.mjs
          scripts/i18n-host-manifest.test.mjs
      - run: npm run check:i18n
      - run: npx lerna run check --stream
