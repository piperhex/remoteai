name: CUA package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified package version
        type: boolean
        default: false
  push:
    branches: [master]
    tags: ["cua-v*"]
    paths: ["packages/cua/**", ".github/workflows/cua-release.yml"]
  pull_request:
    paths: ["packages/cua/**", ".github/workflows/cua-release.yml"]

permissions:
  contents: read

concurrency:
  group: cua-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            runner: windows-2022
            architecture: x64
          - target: windows-arm64
            runner: windows-11-arm
            architecture: arm64
          - target: darwin-universal
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Verify release version and package scripts
        shell: bash
        run: |
          node packages/cua/scripts/test.mjs
          node --input-type=module -e '
            import {tag} from "./packages/cua/scripts/common.mjs";
            if (process.env.GITHUB_REF_TYPE === "tag" && process.env.GITHUB_REF_NAME !== tag)
              throw new Error("CUA tag and package version differ");'
      - name: Verify repository source
        run: node packages/cua/scripts/prepare.mjs
      - name: Install pinned Rust toolchain
        if: startsWith(matrix.target, 'windows-')
        shell: pwsh
        run: |
          $version = (Get-Content packages/cua/upstream.json | ConvertFrom-Json).rust
          rustup toolchain install $version --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Spectre libraries
        if: startsWith(matrix.target, 'windows-')
        shell: pwsh
        run: ./packages/cua/scripts/install-spectre.ps1 -Architecture ${{ matrix.architecture }}
      - uses: swatinem/rust-cache@v2
        if: startsWith(matrix.target, 'windows-')
        with:
          key: cua-${{ matrix.target }}-${{ hashFiles('packages/cua/upstream.json') }}
          workspaces: packages/cua/vendor/libs/cua-driver/rust
      - name: Check patched Windows code
        if: startsWith(matrix.target, 'windows-')
        working-directory: packages/cua/vendor/libs/cua-driver/rust
        shell: pwsh
        run: |
          cargo fmt -p platform-windows -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p platform-windows --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked -p platform-windows --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build verified package
        run: node packages/cua/scripts/build.mjs ${{ matrix.target }}
      - name: Test packaged MCP and runtime dependencies
        shell: pwsh
        env:
          CUA_NATIVE_LAUNCH_TEST: ${{ startsWith(matrix.target, 'windows-') && '1' || '0' }}
        run: |
          $target = '${{ matrix.target }}'
          $metadata = Get-Content ".codex-tmp/cua-release/$target.json" | ConvertFrom-Json
          New-Item -ItemType Directory .codex-tmp/cua-smoke | Out-Null
          tar -xf ".codex-tmp/cua-release/$($metadata.filename)" -C .codex-tmp/cua-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($IsWindows) {
            $directory = ".codex-tmp/cua-smoke/cua-driver-rs-$($metadata.version)-$target"
            foreach ($binary in @('cua-driver.exe', 'cua_driver_sdk.dll')) {
              node scripts/verify-windows-runtime.mjs "$directory/$binary"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            node packages/cua/scripts/smoke.mjs "$directory/cua-driver.exe"
          } else {
            node packages/cua/scripts/smoke.mjs .codex-tmp/cua-smoke/cua-driver
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: cua-${{ matrix.target }}
          path: |
            .codex-tmp/cua-release/cua-driver-rs-*
            .codex-tmp/cua-release/${{ matrix.target }}.json
          if-no-files-found: error
          compression-level: 0

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/cua-v') || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          pattern: cua-*
          path: .codex-tmp/cua-release
          merge-multiple: true
      - name: Verify all artifacts and provenance
        run: |
          node packages/cua/scripts/manifest.mjs
          cp packages/cua/LICENSE.upstream .codex-tmp/cua-release/
          cp packages/cua/README.md .codex-tmp/cua-release/README.md
      - name: Publish independent CUA release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag=$(node -p '"cua-v" + require("./packages/cua/package.json").version')
          git fetch --tags origin
          if git rev-parse --verify "refs/tags/$release_tag" >/dev/null 2>&1; then
            test "$(git rev-parse "$release_tag^{commit}")" = "$GITHUB_SHA"
          fi
          gh release create "$release_tag" .codex-tmp/cua-release/* \
            --target "$GITHUB_SHA" --title "Remote AI CUA ${release_tag#cua-v}" \
            --notes-file packages/cua/README.md --latest=false
