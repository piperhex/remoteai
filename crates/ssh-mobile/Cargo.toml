[package]
name = "csw-ssh-mobile"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
csw-ssh-client = { path = "../ssh-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
zeroize = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
