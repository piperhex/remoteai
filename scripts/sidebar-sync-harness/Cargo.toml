[package]
name = "remoteai-sidebar-sync-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Exercise the production module and its tests without booting Tauri or building native engines.
[lib]
path = "../../apps/desktop/src-tauri/src/codex_sidebar/mod.rs"
doctest = false

[dependencies]
base64 = "0.22"
hex = "0.4"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
